services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mealplanner
    ports:
      - "5433:5432"

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"

  backend:
    build: ./backend
    ports:
      - "8001:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mealplanner
      - REDIS_URL=redis://redis:6379/0
      - USE_MOCK_AI=True # Set to False and provide API key for real AI
      # - OPENROUTER_API_KEY=your_key_here
    depends_on:
      - db
      - redis

  celery_worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mealplanner
      - REDIS_URL=redis://redis:6379/0
      - USE_MOCK_AI=True
    depends_on:
      - db
      - redis
      - backend

  frontend:
    build: ./frontend
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  postgres_data:

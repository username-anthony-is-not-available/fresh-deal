name: Run Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./smart-meal-planner/backend
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r requirements.txt -r requirements-dev.txt
    - name: Run tests with coverage
      run: python3 -m pytest --cov=app --cov-report=term-missing --cov-fail-under=50

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./smart-meal-planner/frontend
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install dependencies
      run: npm install
    - name: Install Playwright browsers
      run: npx playwright install --with-deps
    - name: Run unit tests
      run: npm test -- --run # Pass --run to prevent watch mode
    - name: Run e2e tests
      run: npm run test:e2e

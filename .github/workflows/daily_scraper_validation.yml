name: Daily Scraper Validation

on:
  schedule:
    - cron: '0 5 * * *'  # Runs at 05:00 UTC daily
  workflow_dispatch:      # Allows manual trigger

jobs:
  validate-scrapers:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./smart-meal-planner/backend

    env:
      WEBHOOK_URL: ${{ secrets.SCRAPER_WEBHOOK_URL }}
      DATABASE_URL: "sqlite:///./test.db"
      USE_SQLITE_LOCAL: "True"
      USE_MOCK_AI: "True"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright browsers and deps
      run: |
        pip install playwright
        playwright install chromium --with-deps

    - name: Run Scraper Validation
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        python scripts/validate_scrapers.py
